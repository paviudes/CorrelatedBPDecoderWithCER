[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "correlated-bp-decoder"
version = "0.1.0"
description = "Python translation of Pavi's correlated neural belief-propagation decoder."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
correlated-bp-run-neural = "correlated_bp_decoder.experiments.run_neural_bp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
