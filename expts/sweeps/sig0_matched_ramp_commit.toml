# =============================================================================
# sig0_matched_ramp_commit.toml -- sweep_hyperparams.sh settings: train and test
# on the SAME fixed-gate error model (sigma = 0) at three rates.
#
# A dataset (p, sig, s) draws one depolarizing rate per CNOT gate from N(p, sig),
# so at sig > 0 a training file and a test file describe different devices even
# at the same (p, sig). At sig = 0 every gate has rate p, so train_<key> and
# test_<key> share one error model. Every model here is tested only on its own
# training key (test_keys = []); the sample index is fixed at s = 1.
#
# On Trillium's GPU login node (ssh trillium-gpu.alliancecan.ca, i.e. trig-login01),
# from expts/ of the repository under $SCRATCH (warm the depot first, and again
# whenever src/ changed since the last precompile):
#     module load StdEnv/2023 julia/1.12.5 cuda/12.6
#     bash misc/precompile_depot.sh
#     bash sweep_hyperparams.sh sweeps/sig0_matched_ramp_commit.toml
# then the two sbatch lines it prints (training, then testing chained on it).
# (Moved from Narval on 2026-10-27, its compute nodes being down until Oct 30;
# cluster = "narval" runs it there again.)
#
# POINTS: 3 rates x {tanh, enriched} x {ramp + first, ramp + last} x 5 seeds = 60
# trainings and 60 tests. Both check nodes are CER arms (use_CER = true: the key's
# per-qubit rates are the priors); the enriched one also puts the key's pair
# couplings into the check factor, starting from alpha* of its own training key
# (0.420 / 0.457 / 0.488 at p = 0.0007 / 0.0011 / 0.0015) and learning it.
# include_nocer = true adds the uniform-prior tanh baseline (30 more points).
#
# The two layer designs share the loss (ramp) and differ only in the readout,
# which training never reads, so at each seed they train the SAME model twice
# (GPU training is deterministic); compare_sweep_arms.py checks that the weights
# are identical before it compares the counts. Everything else comes from the run
# directory's hyperparams_baseline.toml: 10 epochs x 500 updates x 20, lr 1e-3,
# init 0.1, ramp warmup 0 (k = 3), the Poisson(3) 10k training set, the
# hand-written gradient on the GPU.
#
# NAMES: run tags _cer_rampfirst, _cer_ramplast, _cer_enr_rampfirst and
# _cer_enr_ramplast, after train_p_<p>_sig_0.0_s_1, so nothing already in the run
# directory is replaced:
#     models/neuralbp_weights_nlayers_90_epochs_10_trained_using_train_p_0.0007_sig_0.0_s_1_cer_enr_rampfirst_seed_1.json
#     results/simulation_results_test_p_0.0007_sig_0.0_s_1_nlayers_90_epochs_10_trained_using_train_p_0.0007_sig_0.0_s_1_cer_enr_rampfirst_seed_1.csv
#
# AFTERWARDS, one rate at a time (the first arm is the reference; the weights check
# is against it, hence the second line for the enriched pair):
#     for key in p_0.0007_sig_0.0_s_1 p_0.0011_sig_0.0_s_1 p_0.0015_sig_0.0_s_1; do
#         python3 misc/compare_sweep_arms.py --workdir 72q_BB_cycles_1_sweep_filtered --train-key $key \
#             --arms _cer_ramplast _cer_rampfirst _cer_enr_ramplast _cer_enr_rampfirst
#         python3 misc/compare_sweep_arms.py --workdir 72q_BB_cycles_1_sweep_filtered --train-key $key \
#             --arms _cer_enr_ramplast _cer_enr_rampfirst
#     done
#
# KEEP EACH ARRAY ON ONE LINE: the generator reads a key with grep | head -1.
# =============================================================================

cluster          = "trillium"        # clusters/trillium.toml: one H100 (a quarter node) per task
workdir          = "./../data"
codename         = "72q_BB_cycles_1_sweep_filtered"

# --- datasets: train on each key, test on the same key ------------------------
datasets         = ["p_0.0007_sig_0.0_s_1", "p_0.0011_sig_0.0_s_1", "p_0.0015_sig_0.0_s_1"]
ref_datasets     = []
# [] = each model is scored on the test set of ITS OWN training key and nothing
# else: the model trained on train_p_0.0007_sig_0.0_s_1 is tested on
# test_p_0.0007_sig_0.0_s_1 only (test_keys_of in hp_sweep/sweep.sh). A list here
# would score every model on every listed key instead.
test_keys        = []

base_hyperparams = "hyperparams_baseline.toml"
seeds            = [1, 2, 3, 4, 5]

# --- arms ----------------------------------------------------------------------
include_nocer    = false
single_qubit_rescale = 0.1
check_node_arms  = ["tanh", "enriched:alpha_star:learn"]
# Both arms name their layer pair, so no top-level loss_layer_selection /
# commit_layer_rule is set here.
optimizer_arms   = ["rampfirst:loss_layer_selection=ramp,commit_layer_rule=first", "ramplast:loss_layer_selection=ramp,commit_layer_rule=last"]

# --- jobs ------------------------------------------------------------------------
# TRAINING: 60 points / 15 tasks = 4 per task = one wave of the profile's
# train_jobs = 4 sharing the card; the interleaved split gives every task 2 tanh +
# 2 enriched points. Estimate: 900 s startup + 10 epochs x 300 s = 65 min.
train_array_tasks = 15
train_wall_time  = "3:00:00"
# TESTING: one test at a time per card; 60 tests / 8 tasks = 8 per task.
# Estimate: 900 s + 8 x 150 s = 35 min.
test_array_tasks = 8
test_wall_time   = "1:00:00"