# =============================================================================
# sig0_init_at_bp.toml -- sweep_hyperparams.sh settings: start training exactly at BP.
#
# Why (2026-10-28, sweeps/sig0_lr_init_fwb.toml on this key): the untrained decoder
# with every weight 1 -- plain BP with the NBP's priors and clamps -- fails 2024 per
# 10^6 (tanh), while the random start U(1 +- 0.1) fails 2526 (seeds 3203 / 2233 /
# 2141). So lr 1e-3 training mostly undid the damage of its own start: 26% better
# than the start, 7% better than plain BP (1876). The enriched node trained from
# U(1 +- 0.1) (1708) is no better than untrained at unit weights (1654).
#
# initial_conditions_scale = 0.0 starts at BP: random_values_around_one returns
# 1 + s (2u - 1), so s = 0 gives every message, channel and readout weight exactly 1.
# alpha still starts at alpha* of the key (0.4875, learned) for the enriched node.
# The uniform draws are still taken, and training re-seeds before it draws its 10k
# set, so at one (seed, lambda) the training set and the batch order are the SAME as
# in the ic 0.1 / 0.7 arms of sig0_lr_init_fwb.toml. Those arms are the paired
# controls (GPU training is deterministic) and are not rerun.
#
# POINTS: initial_conditions_scale 0.0 x learning_rate {0.001, 0.01} x
# failure_weight_boundary {1, 2, 3, 4} = 8 optimizer arms x {tanh,
# enriched:alpha_star:learn} x seeds 1-3 = 48 trainings, each tested on its own key.
# lr 0.1 is left out: every point there rolled back or diverged on 2026-10-28, which
# a different start does not change. Everything else as in sig0_lr_init_fwb.toml:
# p_0.0015_sig_0.0_s_1, ramp loss (warmup 0, k = 3), commit first, 10 epochs, the
# 10k training set, the run directory's hyperparams_baseline.toml.
#
# Keep the previous sweep's models and results in the run directory (no
# misc/cleanup.py on it): they are the controls the comparison reads.
#
# On Trillium's GPU login node (ssh trillium-gpu.alliancecan.ca, i.e. trig-login01),
# from expts/ of the repository under $SCRATCH:
#     module load StdEnv/2023 julia/1.12.5 cuda/12.6
#     export JULIA_DEPOT_PATH="$SCRATCH/.julia:"
#     bash sweep_hyperparams.sh sweeps/sig0_init_at_bp.toml
# then the two sbatch lines it prints. Watch it with sq ON trig-login01 (the CPU
# login nodes do not list GPU jobs). If a task fails at the CUDA check
# (CUDA_ERROR_MPS_CONNECTION_FAILED, as tasks 26-27 did on 2026-10-27), rerun only it:
#     TRAIN_ID=$(sbatch --parsable --array=<task> ../data/72q_BB_cycles_1_sweep_filtered/cluster/hp_sweep_train_<ts>.sh)
#     sbatch --dependency=afterok:$TRAIN_ID ../data/72q_BB_cycles_1_sweep_filtered/cluster/hp_sweep_test_<ts>.sh
# (after scancel of the test job stuck as DependencyNeverSatisfied).
#
# NAMES: run tags _cer_ic0p0_fwb<lambda>_lr<lr> (tanh) and _cer_enr_ic0p0_fwb<lambda>_lr<lr>
# (enriched), after train_p_0.0015_sig_0.0_s_1; nothing already in the run directory
# is replaced.
#
# AFTERWARDS, each start at BP against the ic 0.1 control with the same lr and lambda:
#     for node in _cer_ _cer_enr_; do for lr in 0p001 0p01; do for f in 1 2 3 4; do
#         python3 misc/compare_sweep_arms.py --workdir 72q_BB_cycles_1_sweep_filtered \
#             --train-key p_0.0015_sig_0.0_s_1 --arms ${node}ic0p1_fwb${f}_lr${lr} ${node}ic0p0_fwb${f}_lr${lr}
#     done; done; done
#
# KEEP EACH ARRAY ON ONE LINE: the generator reads a key with grep | head -1.
# =============================================================================

cluster          = "trillium"        # clusters/trillium.toml: one H100 (a quarter node) per task
workdir          = "./../data"
codename         = "72q_BB_cycles_1_sweep_filtered"

# --- dataset: train on it, test on the same key ------------------------------------
datasets         = ["p_0.0015_sig_0.0_s_1"]
ref_datasets     = []
test_keys        = []                # [] = each model is tested on its own training key only

base_hyperparams = "hyperparams_baseline.toml"
seeds            = [1, 2, 3]         # the seeds of the ic 0.1 / 0.7 controls

# --- arms ----------------------------------------------------------------------
include_nocer    = false
single_qubit_rescale = 0.1
check_node_arms  = ["tanh", "enriched:alpha_star:learn"]
# The layer pair of every arm (no arm names its own).
loss_layer_selection = "ramp"
commit_layer_rule    = "first"
# <tag>:<overrides>; tag = ic<s>_fwb<lambda>_lr<lr> with "." -> "p". lr 0.001 first,
# lambda 3 leading (the old baseline's lambda), then lr 0.01.
optimizer_arms   = ["ic0p0_fwb3_lr0p001:initial_conditions_scale=0.0,failure_weight_boundary=3,learning_rate=0.001", "ic0p0_fwb1_lr0p001:initial_conditions_scale=0.0,failure_weight_boundary=1,learning_rate=0.001", "ic0p0_fwb2_lr0p001:initial_conditions_scale=0.0,failure_weight_boundary=2,learning_rate=0.001", "ic0p0_fwb4_lr0p001:initial_conditions_scale=0.0,failure_weight_boundary=4,learning_rate=0.001", "ic0p0_fwb1_lr0p01:initial_conditions_scale=0.0,failure_weight_boundary=1,learning_rate=0.01", "ic0p0_fwb2_lr0p01:initial_conditions_scale=0.0,failure_weight_boundary=2,learning_rate=0.01", "ic0p0_fwb3_lr0p01:initial_conditions_scale=0.0,failure_weight_boundary=3,learning_rate=0.01", "ic0p0_fwb4_lr0p01:initial_conditions_scale=0.0,failure_weight_boundary=4,learning_rate=0.01"]

# --- jobs ------------------------------------------------------------------------
# TRAINING: 48 points / 13 tasks = 4 per task (the last four tasks 3) = one wave of
# the profile's train_jobs = 4 sharing the card. 13, not 12: the interleaved split
# alternates tanh / enriched, so an odd width gives each card 2 tanh + 2 enriched
# points, the mix measured on Trillium. Estimate: 900 s startup + 10 epochs x 300 s
# = 65 min.
train_array_tasks = 13
train_wall_time  = "2:00:00"
# TESTING: one test at a time per card; 48 tests / 6 tasks = 8 per task.
# Estimate: 900 s + 8 x 150 s = 35 min.
test_array_tasks = 6
test_wall_time   = "1:00:00"
