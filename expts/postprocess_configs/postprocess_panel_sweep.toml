# ============================================================================
# postprocess control panel — the 72q_BB_cycles_1_sweep run (2026-10-20)
# ============================================================================
# Gathers the CER vs no-CER run that batch_run.jl submitted: models trained on
# p_0.0015_sig_0.003_s_1, tested on 24 (p, sigma) datasets, 5 seeds per arm, plus
# the BP and BP+OSD tables that come with the data. From the expts/ directory:
#
#   julia --project="./" postprocess.jl --config=postprocess_configs/postprocess_panel_sweep.toml --task=gather
#   julia --project="./" postprocess.jl --config=postprocess_configs/postprocess_panel_sweep.toml --task=neural_gather
#
# The reference gathers find their files by `pattern` (shell-style: * is any
# run of characters); neural_gather selects by the same (p, sigma), sample, seed
# and arm settings as submit.sh. `files = [...]` still works alongside either.
# Outputs are written into <workdir>/<codename>/results and REPLACED on each run.
# ============================================================================

workdir = "./../data"

# ###### Reference decoders, one table per (p, sigma, sample) dataset ##########
# Each file is one line, "p sample failures trials LER stderr" at 10^6 trials;
# sigma is only in the name, so the gather adds test_p, test_sigma, test_sample
# (and decoder, test_key, results_file) from the name. `test_pairs` (left out =
# every [p, sigma] pair) and `test_samples` (left out = every sample) keep only
# those test datasets, as in [neural_gather]. The data has samples 1–5 (1–3 at
# sigma = 0, so 104 tables per decoder); the Neural BP run tested sample 1.
[standardbp_gather]
run = true
error_model = "Circuit"
codename = "72q_BB_cycles_1_sweep"
pattern = "72q_BB_p_*BP+OSD_failure_rates_OSD_E_order_2.txt"
test_samples = [1]
output_file = "decoder_statistics_BP_OSD.csv"

[bp_gather]
run = true
error_model = "Circuit"
codename = "72q_BB_cycles_1_sweep"
pattern = "72q_BB_p_*_BP_failure_rates.txt"
test_samples = [1]
output_file = "decoder_statistics_BP.csv"

# ###### Neural BP ############################################################
# The run: 2 arms x 5 seeds x 24 test datasets = 240 results CSVs, one row each.
# Each row gets, from its file name: results_file, arm ("cer" / "nocer"),
# use_CER, run_tag, test_key, test_p, test_sigma, test_sample, train_key,
# train_p, train_sigma, train_sample — the arm and the datasets are in no column
# of the CSV itself.
[neural_gather]
run = true
codename = "72q_BB_cycles_1_sweep"
# Which results CSVs to gather, in submit.sh's format: numbers, not "2p". Each
# key narrows the selection, read off the file names; leave a key out (or set it
# to []) to keep every value.
#
# The training dataset of the models, [p, sigma, sample]:
train_instance = [0.0015, 0.003, 1]
# Test datasets: every [p, sigma] pair below at every index in test_samples.
test_pairs = [
    [0.0001, 0.0], [0.0001, 0.0001], [0.0001, 0.0002],
    [0.0003, 0.0], [0.0003, 0.0003], [0.0003, 0.0006],
    [0.0005, 0.0], [0.0005, 0.0005], [0.0005, 0.001],
    [0.0007, 0.0], [0.0007, 0.0007], [0.0007, 0.0014],
    [0.0009, 0.0], [0.0009, 0.0009], [0.0009, 0.0018],
    [0.0011, 0.0], [0.0011, 0.0011], [0.0011, 0.0022],
    [0.0013, 0.0], [0.0013, 0.0013], [0.0013, 0.0026],
    [0.0015, 0.0], [0.0015, 0.0015], [0.0015, 0.003],
]
test_samples = [1]
seeds = [1, 2, 3, 4, 5]
# "cer" (run tag _cer) and/or "nocer" (_nocer); run_label = "big" selects the
# _cer_big / _nocer_big files of a submission made with that label. An arm can
# carry its own submission's label: "cer_enr" is the CER arm of
# expts/sweeps/enriched_submission.toml (run_label = "enr"), "cer_bethe" that of
# bethe_submission.toml. Once those runs are in, gather all the arms with
#     cer_arms = ["cer", "nocer", "cer_enr", "cer_bethe"]
cer_arms = ["cer", "nocer"]
run_label = ""
# With cer_arms, seeds, test_pairs and test_samples all set, the gather warns
# about every requested (arm, seed, test dataset) with no results file, or with
# more than one. Candidate files: every simulation_results_*.csv in results/,
# unless `pattern` or `files` names others.
output_neuralbp_file = "decoder_statistics_NeuralBP.csv"

# ###### Plots: OFF for this run ###############################################
# The plot sections group rows by p ALONE (the test_p_<p> tag in the
# description) and average everything else: here that would average sigma = 0,
# p and 2p, and both arms, into one point per p. Use the gathered CSVs' columns
# (arm, test_p, test_sigma, test_sample, seed) instead until the plots learn them.

[task_groups]
gather = ["standardbp_gather", "bp_gather", "neural_gather"]
