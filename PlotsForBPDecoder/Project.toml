name = "PlotsForBPDecoder"
uuid = "970ff3ed-ed82-485e-830d-4055608077b0"
version = "0.1.0"

# Companion package to CorrelatedBPDecoderWithCER — provides plotting helpers
# for local analysis on your Mac. Kept separate so the heavyweight Plots.jl +
# StatsPlots.jl stack never has to install/precompile on the HPC cluster.

[deps]
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
CorrelatedBPDecoderWithCER = "79c285b1-ed6b-500e-a219-fceca9620707"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
StatsPlots = "f3b207a7-027a-5e70-b257-86293d7955fd"

# `[sources]` (Julia 1.11+) tells Pkg to resolve CorrelatedBPDecoderWithCER
# from the sibling directory, not from a registry. Same idea as `Pkg.develop`
# but committed to Project.toml so `Pkg.instantiate()` works on a fresh clone
# without any extra setup steps.
[sources]
CorrelatedBPDecoderWithCER = {path = ".."}
